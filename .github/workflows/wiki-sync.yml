name: Publish wiki

# One-way publish of docs/wiki/ to the GitHub wiki (D-016).
# The wiki is never edited directly; edit docs/wiki/ and push to main.
#
# Requires a repository secret WIKI_TOKEN: a personal access token that can push to
# this repository (classic token with `public_repo` scope for a public repo, or `repo`
# for a private one).

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-sync
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::Repository secret WIKI_TOKEN is not set. See the header of this workflow."
            exit 1
          fi

      - name: Clone wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki \
          || { echo "::error::Could not clone the wiki. Create the first wiki page in the GitHub UI once, then re-run."; exit 1; }

      - name: Sync pages
        run: |
          find wiki -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -R docs/wiki/. wiki/
          cat > wiki/_Footer.md <<EOF
          _Generated from [\`docs/wiki/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/docs/wiki) at commit [\`${GITHUB_SHA::7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Do not edit the wiki directly; change the files in the repository instead._
          EOF

      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Publish docs/wiki from ${GITHUB_SHA::7}"
          git push
