schema_version: "1.0"

bundle:
  id: "aisdlc"
  name: "aisdlc"
  version: "0.0.1"
  role: "developer"
  description: "Generic SDLC add-on for Spec Kit: aisdlc extension, preset and workflows at one version."
  author: "speckit-aisdlc contributors"
  license: "MIT"

requires:
  speckit_version: ">=1.0.5,<2.0.0"
  tools: []
  mcp: []

# Integration-agnostic on purpose: no top-level `integration` pin.
provides:
  extensions:
    - id: "aisdlc"
      version: "0.0.1"
  presets:
    - id: "aisdlc"
      version: "0.0.1"
      priority: 10
      # Required by bundle validation, but only recorded and displayed: each
      # entry's own `strategy` in preset/preset.yml is what Spec Kit applies.
      # `append` states the intent — aisdlc composes, never replaces (hard rule 2).
      strategy: "append"
  workflows:
    - id: "aisdlc-feature"
      version: "0.0.1"

tags: ["sdlc", "workflow", "verification"]
